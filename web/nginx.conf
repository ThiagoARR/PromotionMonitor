server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # host.docker.internal comes from compose extra_hosts (host-gateway).
    # Used because container-to-container bridge traffic to the API can be filtered on some hosts.
    location /api/ {
        proxy_pass http://host.docker.internal:45881/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://host.docker.internal:45881/health;
    }

    location /hangfire {
        proxy_pass http://host.docker.internal:45881/hangfire;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
