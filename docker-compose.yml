services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_Password123}"
    ports:
      - "1433:1433"
    volumes:
      - pm-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: src/PromotionMonitor.Api/Dockerfile
    container_name: pm-api
    # Reach SQL via published host port — container-to-container :1433 is blocked on some hosts.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=host.docker.internal,1433;Database=${MSSQL_DATABASE:-PromotionMonitor};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_strong_Password123};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "${JWT_KEY:-dev-only-change-me-to-a-long-random-secret-key-32chars}"
      Jwt__Issuer: "${JWT_ISSUER:-PromotionMonitor}"
      Jwt__Audience: "${JWT_AUDIENCE:-PromotionMonitor}"
      Jwt__ExpiryHours: "${JWT_EXPIRY_HOURS:-24}"
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__From: "${SMTP_FROM:-}"
      Smtp__EnableSsl: "${SMTP_ENABLE_SSL:-true}"
      Shipping__ApiUrl: "${SHIPPING_API_URL:-}"
      Shipping__ApiKey: "${SHIPPING_API_KEY:-}"
      Cors__Origins__0: "http://localhost:45173"
      Cors__Origins__1: "http://127.0.0.1:45173"
      Cors__Origins__2: "http://web"
    ports:
      - "45881:8080"
    restart: on-failure
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: pm-web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "45173:80"
    depends_on:
      - api

volumes:
  pm-sql-data:
